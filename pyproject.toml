[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b1500-studio"
version = "1.1.0"
description = "Keysight B1500A measurement suite: SMU DC I-V, MFCMU capacitance and B1530A WGFMU fast-pulse neuromorphic protocols"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Akash Prajapati" }]
keywords = [
    "keysight", "b1500a", "b1530a", "wgfmu", "smu", "memristor",
    "neuromorphic", "ferroelectric", "resistive-switching", "instrument-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
# Only the SMU and MFCMU need VISA; the WGFMU goes through Keysight's DLL,
# and nothing at all is needed to run against the simulator.
smu = ["pyvisa>=1.13"]
dev = ["pytest>=7.0"]
all = ["PySide6>=6.5", "pyvisa>=1.13", "pytest>=7.0"]

[project.urls]
Source = "https://github.com/akashp1/b1500-studio"

[project.scripts]
b1500-studio = "b1500_studio.cli:main"

[tool.setuptools.packages.find]
include = ["b1500_studio*"]

[tool.setuptools.package-data]
b1500_studio = ["resources/*.png", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
